[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stereocraft"
version = "2.4.0"
description = "Turn a photo into a full-resolution side-by-side 3D image"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    # Depth Anything 3's input pipeline reaches for both of these.
    "torchvision",
    "opencv-python",
    "transformers>=4.41",  # the da2 fallback models
    # Installed without its own dependency list: the full set replaces torch with
    # a different CUDA build, and pulls in a reconstruction and visualisation
    # stack -- open3d, pycolmap, moviepy, flask -- that depth inference never
    # touches.  What it actually needs at runtime is the handful below, each one
    # checked by blocking its import and converting a photo.  `evo` is
    # deliberately not here: DA3 wants it for pose alignment, which this app
    # never does, and it is the tree's one GPL-3.0 package.
    "depth-anything-3",
    "einops",
    "addict",
    "omegaconf",
    "tqdm",
    "imageio",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "numpy>=1.24,<2",  # pinned by depth-anything-3
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stereocraft = "stereocraft.cli:main"
stereocraft-gui = "stereocraft.gui:main"

[tool.setuptools]
packages = ["stereocraft"]

[tool.setuptools.package-data]
stereocraft = ["*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not slow"` skips everything needing the depth model, which is the
# difference between a second and half a minute.
markers = ["slow: needs the depth model loaded"]

[tool.black]
line-length = 110
